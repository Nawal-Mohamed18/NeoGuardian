# Local PostgreSQL for NeoGuardian (Docker Desktop)
services:
  db:
    image: postgres:16-alpine
    container_name: neoguardian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: neoguardian
      POSTGRES_USER: neoguardian
      POSTGRES_PASSWORD: neoguardian
    ports:
      - "5432:5432"
    volumes:
      - neoguardian_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neoguardian -d neoguardian"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neoguardian_pgdata:
